services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: odin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odin}
      POSTGRES_DB: odin
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odin -d odin"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://odin:${POSTGRES_PASSWORD:-odin}@db:5432/odin
      AI_MODE: ${AI_MODE:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend_environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://odin:${POSTGRES_PASSWORD:-odin}@db:5432/odin
      TEST_DATABASE_URL: postgresql+psycopg://odin:${POSTGRES_PASSWORD:-odin}@db:5432/odin
      AI_MODE: mock
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
